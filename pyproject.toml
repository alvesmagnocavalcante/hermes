[project]
name = "projeto-hermes"
version = "0.1.0"
description = "Painel desktop modular para automações de planilhas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "flet[all,desktop]>=0.86.1,<0.87",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.2",
    "xlrd>=2.0.2",
]

[tool.flet.app]
exclude = [
    ".git",
    ".venv",
    "build",
    "PROCESSOS AUTOMAÇÃO",
    "docs",
    "__pycache__",
    "hermes.png",
    "hermes.ico",
    "deus.png",
]
