map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    server_name hermes.carmel;

    # Limite alinhado ao tamanho total maximo aceito pelo HERMES.
    client_max_body_size 200m;

    # Rede administrativa atual: 10.197.0.127/22.
    allow 10.197.0.0/22;
    allow 127.0.0.1;
    allow ::1;

    # O Docker Desktop entrega conexoes publicadas pelo gateway NAT interno.
    # A restricao aos clientes 10.197.0.0/22 e aplicada primeiro no Firewall.
    allow 172.16.0.0/12;
    deny all;

    auth_basic "HERMES - acesso restrito";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /healthz {
        access_log off;
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 200;
    }

    location / {
        proxy_pass http://hermes:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
