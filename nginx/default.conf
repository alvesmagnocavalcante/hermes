map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    server_name _;

    # Limite alinhado ao tamanho total maximo aceito pelo HERMES.
    client_max_body_size 200m;

    # Rede administrativa atual: 10.197.0.127/22.
    allow 10.197.0.0/22;
    allow 127.0.0.1;
    allow ::1;

    # O Docker Desktop entrega conexoes publicadas pelo gateway NAT interno.
    # A restricao aos clientes 10.197.0.0/22 e aplicada primeiro no Firewall.
    allow 172.16.0.0/12;
    deny all;

    location = /healthz {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 200;
    }

    # O navegador mantém favicons em cache por longos períodos. O arquivo
    # versionado garante que o símbolo oficial da Carmel substitua o ícone
    # antigo do HERMES imediatamente apó a publicação.
    location = /favicon-carmel.png {
        proxy_pass http://hermes:8000/favicon-carmel.png;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://hermes:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # O Flet referencia favicon.png no HTML padrão. Alteramos somente essa
        # referência para invalidar o cache do ícone anterior nos navegadores.
        sub_filter 'href="favicon.png"' 'href="favicon-carmel.png?v=20261019"';
        sub_filter_once on;
    }
}
